name: Build Multi-Arch Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'bin/**'
      - 'source/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          echo "version=2.7.7" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/openvpn:2.7.7
            ${{ secrets.DOCKER_USERNAME }}/openvpn:latest
          labels: |
            org.opencontainers.image.title=OpenVPN
            org.opencontainers.image.description=Production-ready OpenVPN 2.7.7 with EasyRSA and OpenSSL 3.6.4
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/openvpn
          short-description: Production-ready OpenVPN 2.7.7 server with EasyRSA & 6 management scripts
          description: |
            # OpenVPN 2.7.7 Production Server

            ## Features
            - **OpenVPN 2.7.7** - Built from official source
            - **OpenSSL 3.6.4** - Compiled from source, CVE-2026-75803 patched
            - **EasyRSA 3.2.6** - Automated PKI management
            - **6 Management Scripts** - create-clients, revoke-clients, list-clients, status, renew-clients, backup-pki
            - **Multi-Architecture** - Supports linux/amd64 and linux/arm64
            - **Audit Logging** - Compliance-ready logging
            - **Encrypted Backups** - GPG-encrypted backup/restore

            ## Quick Start

            ```bash
            docker run -d \
              --name openvpn \
              --cap-add NET_ADMIN \
              --device /dev/net/tun \
              -p 1194:1194/udp \
              -v openvpn-data:/etc/openvpn/pki \
              -v openvpn-logs:/var/log/openvpn \
              ${{ secrets.DOCKER_USERNAME }}/openvpn:2.7.7
            ```

            ## Security
            - Multi-stage build (minimal runtime image)
            - Perl removed to eliminate CVEs
            - OpenSSL 3.6.4 with CVE-2026-75803 patch
            - ~160 vulnerabilities in image (optimized)

            ## Documentation
            - [GitHub Repository](https://github.com/Zaliyo/openvpn)
            - [README](https://github.com/Zaliyo/openvpn/blob/main/README.md)
            - [CHANGELOG](https://github.com/Zaliyo/openvpn/blob/main/CHANGELOG.md)

      - name: Build summary
        run: |
          echo "## Docker Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ secrets.DOCKER_USERNAME }}/openvpn" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** 2.7.7, latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
