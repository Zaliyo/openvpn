name: Build Multi-Arch Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'bin/**'
      - 'source/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from Dockerfile
        id: meta
        run: |
          OPENVPN_VERSION=$(grep "^ARG OPENVPN_VERSION=" Dockerfile | cut -d'=' -f2)
          echo "version=${OPENVPN_VERSION}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "Extracted OpenVPN version: ${OPENVPN_VERSION}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/openvpn:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/openvpn:latest
          labels: |
            org.opencontainers.image.title=OpenVPN
            org.opencontainers.image.description=Production-ready OpenVPN ${{ steps.meta.outputs.version }} with EasyRSA and OpenSSL 3.6.4
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/openvpn
          short-description: Production-ready OpenVPN ${{ steps.meta.outputs.version }} server with EasyRSA & 6 management scripts
          readme-filepath: ./docker.md

      - name: Build summary
        run: |
          echo "## Docker Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ secrets.DOCKER_USERNAME }}/openvpn" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** ${{ steps.meta.outputs.version }}, latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
