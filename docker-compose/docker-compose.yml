version: '3.8'

services:
  openvpn:
    image: ${DOCKER_IMAGE:-zaliyo/openvpn:2.7.7}
    container_name: ${CONTAINER_NAME:-openvpn}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${VPN_PORT:-1194}:1194/udp"
    environment:
      - DEBUG=${DEBUG:-0}
    env_file:
      - .env
    volumes:
      - ./openvpn-data/conf:/etc/openvpn/pki
      - ./openvpn-data/logs:/var/log/openvpn
      - ./openvpn-backups:/backups
      - ./users:/opt/users
    networks:
      - openvpn-network
    healthcheck:
      test: ["CMD", "nc", "-u", "-z", "localhost", "1194"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  openvpn-network:
    driver: bridge
